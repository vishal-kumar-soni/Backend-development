<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h2>Chat App</h2>
        <form action="">
            <label for="">Message</label>
            <input type="text" name="" id="">
            <button>Send</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const input = document.querySelector('input');
        const btn = document.querySelector('button');

        btn.addEventListener('click', (e) => {
           e.preventDefault();
           socket.emit('message', input.value.trim()); // emit() is used when message is send from client to server , also used in server side when msg is send from server to client
           input.value = ''; 
        }) 
    </script>
</body>
</html>
